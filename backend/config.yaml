# lover-order 后端配置

server:
  port: 8081
  mode: debug

database:
  host: 127.0.0.1
  port: 3306
  username: root
  password: root
  database: lover_order
  charset: utf8mb4
  parse_time: true
  loc: Local
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 3600

jwt:
  secret: lover-order-jwt-secret-please-change-in-production
  expire_hours: 168
  refresh_expire_hours: 720

apple:
  team_id: ""
  client_id: ""
  key_id: ""
  private_key_path: ""
  jwks_url: https://appleid.apple.com/auth/keys
  issuer: https://appleid.apple.com

# 填入 Apple 开发者后台导出的 APNs .p8 密钥并将 enabled 改为 true 即可启用真实远端推送
apns:
  enabled: false
  team_id: ""
  key_id: ""
  bundle_id: "com.loverorder.app"
  private_key_path: ""
  production: false

upload:
  max_size: 10485760
  allowed_types:
    - jpg
    - jpeg
    - png
    - webp
    - heic
  # 敏感密钥写在同目录 config.local.yaml（已加入 .gitignore）或环境变量 OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET
  # 后续接入阿里云 CDN 时，只需将 public_base_url 改为 CDN 域名即可无缝切换
  oss:
    endpoint: oss-cn-hangzhou.aliyuncs.com
    bucket: lover-order-media-ayuan
    access_key_id: ""
    access_key_secret: ""
    prefix: uploads
    public_base_url: http://lover-order-media-ayuan.oss-cn-hangzhou.aliyuncs.com

log:
  level: info
  file: ./logs/app.log
  max_size: 100
  max_backups: 3
  max_age: 28

cors:
  allow_origins:
    - "*"
  allow_methods:
    - GET
    - POST
  allow_headers:
    - Origin
    - Content-Type
    - Authorization
